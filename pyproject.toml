[project]
name = "binderseal"
version = "1.0.0"
description = "Local-first evidence binder sealer for QuantumGuard CONTRACT-v1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Operator Pages LLC" }]
dependencies = ["cryptography>=42.0.0"]

[project.scripts]
binderseal = "binderseal:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
